services:
  postgres:
    image: postgres:18-alpine
    container_name: payment_postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_payment_data:
